schema_version = "1.1"

[task]
name = "cpu-ml-engineering/readmission-alerting"
description = "A readmission alerting pipeline publishes a figure that cannot be reconciled with what the care team sees; drive the gated loop until the published figure is one the team could act on."
keywords = ["cpu-ml-engineering", "long-horizon", "gated-ops"]

[verifier]
timeout_sec = 2700.0
user = "root"


[agent]
timeout_sec = 3600.0
user = "ubuntu"

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = false
